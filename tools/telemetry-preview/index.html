<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Apex Telemetry preview</title>
<style>
  body { background: #111; color: #ddd; font: 14px system-ui, sans-serif; margin: 12px; }
  canvas { display: block; width: 1600px; max-width: 100%; image-rendering: auto; border: 1px solid #333; }
  .bar { margin-bottom: 8px; display: flex; gap: 14px; align-items: center; }
</style>
</head>
<body>
<!-- Apex Telemetry's page as the car draws it: apps/apex_telemetry/draw.js on a stand-in for the kit's canvas
     (same calls, the same baked 'race' font from kit/runtime/fonts). Serve the repo root, open /tools/telemetry-preview/. -->
<div class="bar">
  Scene <select id="scene"><option value="street">Street, warm</option><option value="cold">Cold start</option><option value="track">Hot track lap</option><option value="none">No data yet</option></select>
  Units <select id="units"><option value="us">US</option><option value="metric">Metric</option></select>
</div>
<canvas id="c" width="1600" height="520"></canvas>
<script src="../../apps/apex_telemetry/draw.js?v=2"></script>
<script>
const $ = (id) => document.getElementById(id);
let FONT = null;   // [{ size, glyphs, atlas: Uint8Array, atlasW, atlasH }]

async function loadFont() {
  const j = await (await fetch('../../kit/runtime/fonts/race.json?v=' + Date.now())).json();
  FONT = [];
  for (const s of j.sizes) {
    const bin = Uint8Array.from(atob(s.alpha), (c) => c.charCodeAt(0));
    const ds = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
    const atlas = new Uint8Array(await new Response(ds).arrayBuffer());
    FONT.push({ size: s.size, glyphs: s.glyphs, atlas, atlasW: s.atlasW, atlasH: s.atlasH, cache: new Map() });
  }
}
function pick(size) { let b = null; for (const f of FONT) if (f.size >= size && (!b || f.size < b.size)) b = f; return b || FONT[FONT.length - 1]; }

function makeCv(g) {
  const path = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); };
  const glyphImg = (f, cp, color) => {
    const k = cp + color; let im = f.cache.get(k); if (im) return im;
    const gl = f.glyphs[cp] || f.glyphs[63]; const [gx, gy, gw, gh] = gl;
    im = document.createElement('canvas'); im.width = Math.max(1, gw); im.height = Math.max(1, gh);
    const ig = im.getContext('2d'); ig.fillStyle = color; ig.fillRect(0, 0, 1, 1);
    const [r, gg, b, a] = ig.getImageData(0, 0, 1, 1).data; const d = ig.createImageData(im.width, im.height);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) { const o = (y * gw + x) * 4; d.data[o] = r; d.data[o + 1] = gg; d.data[o + 2] = b; d.data[o + 3] = f.atlas[(gy + y) * f.atlasW + gx + x] * a / 255; }
    ig.putImageData(d, 0, 0); f.cache.set(k, im); return im;
  };
  const measure = (s, size) => { const f = pick(size); let w = 0; for (const ch of String(s)) { const gl = f.glyphs[ch.codePointAt(0)] || f.glyphs[63]; if (gl) w += gl[6]; } return w * size / f.size; };
  return {
    w: 1600, h: 520,
    clear(c) { g.fillStyle = c; g.fillRect(0, 0, 1600, 520); },
    fillRect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); },
    roundRect(x, y, w, h, r, c) { g.fillStyle = c; path(x, y, w, h, r); g.fill(); },
    strokeRoundRect(x, y, w, h, r, lw, c) { g.strokeStyle = c; g.lineWidth = lw; path(x + lw / 2, y + lw / 2, w - lw, h - lw, r); g.stroke(); },
    gradientRect(x, y, w, h, stops) { const gr = g.createLinearGradient(0, y, 0, y + h); stops.forEach(([p, c]) => gr.addColorStop(p, c)); g.fillStyle = gr; g.fillRect(x, y, w, h); },
    circle(cx, cy, r, c) { g.fillStyle = c; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); },
    textWidth(s, size) { return measure(s, size); },
    text(s, x, y, size, c, o) {
      o = o || {}; const f = pick(size), sc = size / f.size, w = measure(s, size);
      let pen = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
      for (const ch of String(s)) {
        const cp = ch.codePointAt(0), gl = f.glyphs[cp] || f.glyphs[63]; if (!gl) continue;
        const [, , gw, gh, ox, oy, adv] = gl;
        if (gw && gh) g.drawImage(glyphImg(f, f.glyphs[cp] ? cp : 63, c), pen + ox * sc, y + oy * sc, gw * sc, gh * sc);
        pen += adv * sc;
      }
      return w;
    },
    target() {},
  };
}

function frame(cv, badges) {   // stand-in for the kit's header strip (G.frame)
  cv.fillRect(0, 0, 1600, 36, '#141518'); cv.fillRect(0, 35, 1600, 1, '#ffffff2e');
  let x = 1584; (badges || []).filter(Boolean).forEach((b) => { const w = cv.textWidth(b.text, 18) + 30; cv.roundRect(x - w, 6, w, 24, 5, b.color + '33'); cv.text(b.text, x - w / 2, 25, 18, b.color, { font: 'race', align: 'center' }); x -= w + 10; });
}

function scene(name) {
  const t = Date.now() / 1000, w = (a, p) => a * Math.sin(t / p);
  const ty = (p, tc, tg) => ({ p, t: tc, target: tg });
  if (name === 'none') return { tyres: { FL: {}, FR: {}, RL: {}, RR: {} }, peak: { gLat: 0, gLong: 0, boost: 0 } };
  if (name === 'cold') return {
    tyres: { FL: ty(2.31, 4, 2.4), FR: ty(2.33, 4, 2.4), RL: ty(2.49, 5, 2.6), RR: ty(2.47, 5, 2.6) },
    coolant: 31, oil: 22, oilP: 5.6, intake: 6, afr: 13.9, timing: 8.5, boost: 0, gearbox: 9, ambient: 2, fuelL: 22, rangeKm: 260, rpm: 1100,
    gLat: 0, gLong: 0, peak: { gLat: 0, gLong: 0, boost: 0 },
  };
  if (name === 'track') return {
    tyres: { FL: ty(2.71, 79, 2.4), FR: ty(2.66, 72, 2.4), RL: ty(2.83, 61, 2.6), RR: ty(2.95, 88, 2.6) },
    coolant: 109, oil: 136, oilP: 4.8, intake: 49, afr: 12.1, timing: 9.5, boost: 1.18, gearbox: 112, ambient: 27, fuelL: 7, rangeKm: 72, rpm: 6400,
    gLat: 0.9 + w(0.05, 1), gLong: 0.3, peak: { gLat: 1.02, gLong: 0.96, boost: 1.24 },
  };
  return {
    tyres: { FL: ty(2.42, 31, 2.4), FR: ty(2.44, 33, 2.4), RL: ty(2.58, 35, 2.6), RR: ty(2.39, 36, 2.6) },
    coolant: 98, oil: 104, oilP: 3.9 + w(0.3, 3), intake: 34, afr: 14.7, timing: 18.5, boost: 0.12, gearbox: 81, ambient: 24, fuelL: 41, rangeKm: 512, rpm: 1900,
    gLat: 0.12, gLong: 0.05, peak: { gLat: 0.61, gLong: 0.48, boost: 1.05 },
  };
}

(async () => {
  await loadFont();
  const g = $('c').getContext('2d'), cv = makeCv(g);
  const paint = () => {
    const s = scene($('scene').value); s.demo = false;
    ApexTelemetryDraw.draw(cv, s, { us: $('units').value === 'us', tyreHot: 70, tyreCold: 15, frame, why: () => 'not asked yet' });
    requestAnimationFrame(paint);
  };
  paint();
})();
</script>
</body>
</html>
