<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cluster layout preview</title>
<style>
  body { background: #111; color: #ddd; font: 14px system-ui, sans-serif; margin: 16px; }
  canvas#out { width: 100%; max-width: 1920px; background: #000; display: block; border: 1px solid #333; }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  label { display: flex; gap: 6px; align-items: center; }
  #warn { font-family: ui-monospace, monospace; white-space: pre; color: #f8b; }
  #ok { color: #8f8; }
</style>
</head>
<body>
<!--
  A PC stand-in for the Mac bench (bench/server.js): draws one cluster layout at 1920x720 with the app's real
  GLSL shaders (shared/shaders.js) and baked fonts (hud/fonts), fed with demo values, and runs the same
  visibility check as the app (shared/visible.js). Serve the repo root and open
  http://localhost:8099/tools/layout-preview/?layout=apex
  Not drawn: BMW's own gauges under the theme, night colours, text "fit" fallbacks.
-->
<div class="row">
  <label>Layout <input id="layout" value="apex" size="10"></label>
  <label>RPM <input id="rpm" type="range" min="0" max="7200" step="50" value="3800"><span id="rpmv"></span></label>
  <label>Gear <select id="gear"><option>P</option><option>R</option><option>N</option><option selected>D3</option><option>S3</option><option>M3</option><option>S5</option></select></label>
  <label>Mode <select id="mode"><option>COMFORT</option><option selected>SPORT</option><option>SPORT PLUS</option><option>ECO PRO</option><option>SPORT INDIVIDUAL</option></select></label>
  <label><input id="car" type="checkbox" checked> Car view (camera, arrows, hood)</label>
  <button id="sweep">Rev sweep</button>
</div>
<canvas id="out" width="1920" height="720"></canvas>
<div class="row"><div id="ok"></div><div id="warn"></div></div>
<script>
'use strict';
const REDLINE = 7000, SHIFT_BEFORE = 300, SHIFT_AT = REDLINE - SHIFT_BEFORE;
const $ = (id) => document.getElementById(id);
const out = $('out'), ctx = out.getContext('2d');
const gl = document.createElement('canvas').getContext('webgl', { premultipliedAlpha: false, preserveDrawingBuffer: true });

async function cjs(url) {        // load a CommonJS file from shared/ (they only use module.exports)
  const src = await (await fetch(url + '?' + Date.now())).text();
  const module = { exports: {} };
  new Function('module', 'exports', 'require', src)(module, module.exports, () => ({}));
  return module.exports;
}
const rgb = (c) => [c[0] / 255, c[1] / 255, c[2] / 255];
const rgba = (c) => [c[0] / 255, c[1] / 255, c[2] / 255, (c[3] === undefined ? 255 : c[3]) / 255];

let SH, TH, VIS, layout, theme, fonts = {}, progs = {};

// ---- effects through WebGL ----
const VS = 'attribute vec2 a; varying vec2 v_uv; void main(){ v_uv = vec2(a.x, 1.0 - a.y); gl_Position = vec4(a * 2.0 - 1.0, 0.0, 1.0); }';
function prog(name) {
  if (progs[name]) return progs[name];
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(name + ': ' + gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, SH[name]));
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
  return (progs[name] = p);
}
function effect(w, name, u) {
  gl.canvas.width = w.w; gl.canvas.height = w.h; gl.viewport(0, 0, w.w, w.h);
  const p = prog(name); gl.useProgram(p);
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i), key = info.name.replace(/\[0\]$/, ''), v = u[key];
    if (v === undefined) continue;
    const loc = gl.getUniformLocation(p, info.name), a = new Float32Array(v);
    ({ [gl.FLOAT]: () => gl.uniform1fv(loc, a), [gl.FLOAT_VEC2]: () => gl.uniform2fv(loc, a),
       [gl.FLOAT_VEC3]: () => gl.uniform3fv(loc, a), [gl.FLOAT_VEC4]: () => gl.uniform4fv(loc, a) }[info.type] || (() => {}))();
  }
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.drawImage(gl.canvas, w.x, w.y);
}

// ---- text from the baked atlases ----
async function font(name) {
  if (fonts[name]) return fonts[name];
  const f = await (await fetch('../../apps/cluster_themes/hud/fonts/' + name + '.json')).json();
  const bin = atob(f.alpha); f.a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) f.a[i] = bin.charCodeAt(i);
  return (fonts[name] = f);
}
function text(x, y, w, h, s, f, col, align, xoff) {
  const g = (ch) => f.glyphs[ch] || f.glyphs[' '] || { x: 0, y: 0, w: 0, h: 0, ox: 0, advance: 0 };
  let width = 0; for (const ch of s) width += g(ch).advance;
  let pen = (xoff || 0) + (align === 'right' ? w - width : align === 'center' ? Math.round((w - width) / 2) : 0);
  const img = ctx.createImageData(w, h);
  for (const ch of s) {
    const q = g(ch), x0 = Math.round(pen + q.ox);
    for (let yy = 0; yy < q.h && yy < h; yy++) for (let xx = 0; xx < q.w; xx++) {
      const dx = x0 + xx; if (dx < 0 || dx >= w) continue;
      const av = f.a[(q.y + yy) * f.width + q.x + xx]; if (!av) continue;
      const k = (yy * w + dx) * 4;
      if (av > img.data[k + 3]) { img.data[k] = col[0]; img.data[k + 1] = col[1]; img.data[k + 2] = col[2]; img.data[k + 3] = av; }
    }
    pen += q.advance;
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').putImageData(img, 0, 0);
  ctx.drawImage(c, x, y);
}

// ---- demo data ----
const SLOT = { speed: ['SPEED', 'MPH', '', '47'], rpm: ['RPM', '', '', null], fuel: ['FUEL', '%', '', '62'],
  boost: ['BOOST', 'PSI', '', '14.2'], coolant: ['COOLANT', '°F', '°', '199'], oil: ['OIL', '°F', '°', '221'],
  oilP: ['OIL PRESS', 'PSI', '', '58'], afr: ['AFR', '', '', '14.7'], intake: ['INTAKE', '°F', '°', '97'], torque: ['TORQUE', 'LB-FT', '', '312'] };
function state() {
  const rpm = Number($('rpm').value);
  return { rpm, now: rpm >= SHIFT_AT, gear: $('gear').value, mode: $('mode').value };
}
function token(t, st, slots) {
  const sl = (id) => SLOT[(slots.find((s) => s.id === id) || {}).default] || ['?', '', '', '--'];
  return t.replace(/\{\{([^}]+)\}\}/g, (_, k) => {
    const [kind, id] = k.split(':');
    if (id !== undefined && kind.indexOf('slot') === 0) {
      const s = sl(id), v = s[3] === null ? String(Math.round(st.rpm / 50) * 50) : s[3];
      return { slot: v, slotHead: s[0], slotUnit: s[1], slotSuffix: s[2], slotHeadU: s[0] + (s[2] ? '' : (s[1] ? ' ' + s[1] : '')) }[kind];
    }
    return { gear: st.gear, gearnum: st.gear.replace(/^[DSM]/, ''), mode: st.mode, dsc: 'DSC ON', badge: 'BMW X3 M40i', rpm: String(st.rpm),
      speed: '47', 'u:speedLc': 'mph', time: '9:30', ampm: 'am', range: '193', 'u:distLc': 'mi', ambient: '+45', 'u:temp': '°F', oil: '221',
      'setup:engine': 'EFFICIENT', 'setup:chassis': 'COMFORT', 'setup:steering': 'COMFORT' }[k] ?? '{{' + k + '}}';
  });
}

// ---- one frame ----
async function draw() {
  const st = state(), t = performance.now();
  $('rpmv').textContent = st.rpm + (st.now ? '  SHIFT' : '');
  ctx.clearRect(0, 0, 1920, 720);
  const max = Math.ceil(REDLINE / 1000) * 1000;
  const lay = layout.shiftBlink > 0 ? layout.shiftBlink : 0;
  const phase = (half) => !st.now ? 0 : (half && Math.floor(t / half) % 2 === 1 ? 2 : 1);   // as hud.js _shiftPhase
  for (const w of layout.widgets) {
    if (w.toggle === 'mapUp' || w.toggle === 'units=metric') continue;     // the preview runs in US units
    const role = (r, d) => (Array.isArray(r) ? r : theme[r || d] || theme.fg);
    if (w.type === 'boxes') {
      const rects = [], styles = [];
      for (let i = 0; i < 12; i++) { const b = w.boxes[i];
        rects.push(b ? b.x - w.x : 0, b ? b.y - w.y : 0, b ? b.w : 0, b ? b.h : 0);
        styles.push(b ? b.head || 0 : 0, b ? (b.border === undefined ? 2 : b.border) : 0, b ? b.radius || 0 : 0, b && b.headColor === 'accent' ? 1 : 0); }
      effect(w, 'boxes', { u_size: [w.w, w.h], u_bg: rgba(Array.isArray(w.color) ? w.color : theme[w.color || 'bg']), u_hole: [0, 0, 0, 0], u_holeR: [0], u_n: [Math.min(12, w.boxes.length)],
        u_box: rects, u_boxStyle: styles, u_fill: rgba(theme.panel), u_line: rgba(theme.line), u_head: rgba(theme.head), u_accent: rgba(theme.accent) });
    } else if (w.type === 'lights') {
      const n = w.count || 12, from = Math.min(w.from ?? 3000, SHIFT_AT - 500);
      const lit = Math.floor(Math.min(1, Math.max(0, (st.rpm - from) / (SHIFT_AT - from))) * n);
      const strobe = phase(w.blink === true ? 100 : (w.blink > 0 ? w.blink : lay));
      effect(w, 'lights', { u_size: [w.w, w.h], u_n: [n], u_tail: [w.tail || 0], u_round: [w.round ? 1 : 0], u_mirror: [w.mirror ? 1 : 0], u_rise: [w.rise > 0 ? Math.min(w.h - 4, w.rise) : 0],
        u_green: rgb(TH.LIGHTS.green), u_yellow: rgb(TH.LIGHTS.yellow), u_red: rgb(TH.LIGHTS.red), u_blue: rgb(TH.LIGHTS.blue),
        u_off: [w.off ?? 0.14], u_lit: [lit], u_strobe: [strobe] });
    } else if (w.type === 'shiftbar') {
      const segs = w.segments || 40, v = Math.min(1, st.rpm / max);
      const ph = w.shiftFlash ? phase(lay) : 0;
      const flash = ph === 1 ? 2 : ph === 2 ? 3 : (st.rpm >= REDLINE - 150 && Math.floor(t / 62.5) % 2 === 0 ? 1 : 0);
      effect(w, 'shiftbar', { u_size: [w.w, w.h], u_segs: [segs], u_low: rgb(theme.bar.low), u_mid: rgb(theme.bar.mid), u_high: rgb(theme.bar.high),
        u_midAt: [theme.bar.midAt === 'shift' ? (REDLINE - 1500) / max : theme.bar.midAt], u_highAt: [(REDLINE - 500) / max],
        u_track: rgba(theme.track), u_flash: [flash], u_value: [Math.round(v * segs * 2) / (segs * 2)] });
    } else if (w.type === 'fill') {
      const c = role(w.color, 'bg'); ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + ((c[3] ?? 255) / 255) + ')'; ctx.fillRect(w.x, w.y, w.w, w.h);
    } else if (w.type === 'dial') {
      const rpmDial = w.measure === 'rpm', mx = rpmDial ? (w.max || 8000) : (w.maxUs || 160), ticks = rpmDial ? mx / 1000 : (w.ticksUs || 8);
      const v = rpmDial ? st.rpm / mx : 47 / mx;
      effect(w, w.type, { u_face2: rgb(role(w.face2 || w.face, 'bg')), u_tip: rgb(role(w.tip, 'fg')), u_inner: [w.inner ?? 0.6], u_size: [w.w, w.h], u_value: [Math.min(1, v)], u_start: [(w.start ?? 225) * Math.PI / 180], u_sweep: [(w.sweep ?? 270) * Math.PI / 180],
        u_ticks: [ticks], u_minor: [w.minor || 4], u_redFrom: [rpmDial ? Math.min(REDLINE, mx - 500) / mx : 2], u_ringW: [w.ringW || 14],
        u_ring: rgb(role(w.ring, 'line')), u_ring2: rgb(role(w.ring2, 'dim')), u_tick: rgb(role(w.tick, 'fg')), u_needle: rgb(role(w.needle, 'hot')),
        u_red: rgb(theme.hot), u_face: rgb(role(w.face, 'bg')), u_cap: rgb(role(w.cap || w.ring2, 'dim')), u_capR: [w.capR ?? 20], u_hot: [rpmDial && st.now ? 1 : 0] });
    } else if (w.type === 'arc') {
      const demo = { fuel: 0.62, oil: 105 }[w.signal] ?? 0, v = (demo - (w.min || 0)) / ((w.max || 1) - (w.min || 0));
      effect(w, 'arc', { u_size: [w.w, w.h], u_value: [Math.max(0, Math.min(1, v))], u_peak: [-1], u_peakC: rgb(theme.fg), u_color: rgb(role(w.color, 'arc')),
        u_track: rgba(theme.track), u_width: [w.width || 7], u_start: [(w.start ?? 225) * Math.PI / 180], u_sweep: [(w.sweep ?? 270) * Math.PI / 180] });
    } else if (w.type === 'box') {
      effect(w, 'box', { u_size: [w.w, w.h], u_fill: rgba(role(w.fill, 'panel')), u_line: rgba(role(w.line, 'line')), u_head: rgba(role(w.headColor, 'head')),
        u_headH: [w.head || 0], u_border: [w.border ?? 2], u_radius: [w.radius || 0] });
    } else if (w.type === 'stripe') {
      [[79, 180, 255], [47, 91, 216], [232, 38, 45]].forEach((c, i) => { ctx.fillStyle = 'rgb(' + c + ')'; ctx.fillRect(w.x + i * w.w / 3, w.y, w.w / 3, w.h); });
    } else if (w.type === 'icon') {
      const c = role(w.color, 'fg'); ctx.strokeStyle = 'rgb(' + c.slice(0, 3) + ')'; ctx.lineWidth = 2;   // the car draws icons.js; a stand-in here
      ctx.beginPath(); ctx.arc(w.x + w.w / 2, w.y + w.h / 2, w.w / 2 - 3, 0, Math.PI * 2); ctx.stroke();
    } else if (w.type === 'scale') {
      const f = await font(w.font), n = max / 1000 + 1;
      for (let i = 0; i < n; i++) { const s = String(i); let lw = 0; for (const ch of s) lw += f.glyphs[ch].advance;
        const left = Math.round(Math.max(0, Math.min(w.w - lw, i / (n - 1) * w.w - lw / 2)));
        text(w.x, w.y, w.w, w.h, s, f, (w.redFrom && i * 1000 >= REDLINE ? theme.hot : theme[w.color || 'dim']), 'left', left); }
    } else if (w.type === 'text') {
      const s = token(w.text, st, layout.slots || []);
      const col = w.hotWhen === 'now' && phase(lay) === 1 ? theme.hot : (theme[w.color || 'fg'] || theme.fg);
      // "fit" as hud.js: a smaller font on the same baseline when the text is too wide or has a missing glyph
      let f = await font(w.font), dy = 0;
      const fits = (g) => [...s].every((ch) => ch === ' ' || g.glyphs[ch]) && [...s].reduce((a, ch) => a + (g.glyphs[ch] || { advance: 0 }).advance, 0) <= w.w;
      if (w.fit && !fits(f)) {
        let g = null; for (const n of w.fit) { const c = await font(n); if (fits(c)) { g = c; break; } }
        g = g || await font(w.fit[w.fit.length - 1]); dy = f.baseline - g.baseline; f = g;
      }
      text(w.x, w.y + dy, w.w, w.h - dy, s, f, col, w.align);
    }
  }
  if ($('car').checked) carView();
}

function carView() {
  ctx.save();
  // hood: everything above the curve is hidden
  ctx.fillStyle = 'rgba(40,40,44,0.92)'; ctx.beginPath(); ctx.moveTo(0, 0);
  VIS.HOOD.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(1920, 0); ctx.closePath(); ctx.fill();
  // the camera pod (a trapezoid, wider at the top)
  const [c0, , c1, cy] = VIS.CAMERA;
  ctx.fillStyle = '#0b0b0c'; ctx.strokeStyle = '#555'; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(c0, 0); ctx.lineTo(c1, 0); ctx.lineTo(c1 - 45, cy); ctx.lineTo(c0 + 45, cy); ctx.closePath(); ctx.fill(); ctx.stroke();
  // BMW's turn arrows, black box, belt light, PARK
  ctx.fillStyle = '#5f5'; VIS.ARROWS.forEach(([x0, y0, x1, y1], i) => { const m = (y0 + y1) / 2, tip = i ? x1 : x0, back = i ? x0 : x1;
    ctx.beginPath(); ctx.moveTo(tip, m); ctx.lineTo((x0 + x1) / 2, y0 + 8); ctx.lineTo((x0 + x1) / 2, m - 12); ctx.lineTo(back, m - 12);
    ctx.lineTo(back, m + 12); ctx.lineTo((x0 + x1) / 2, m + 12); ctx.lineTo((x0 + x1) / 2, y1 - 8); ctx.closePath(); ctx.fill(); });
  // BMW's solid black gear box (the 2023 X3 draws it too)
  { const [b0, b1, b2, b3] = VIS.BLACK_BOX; ctx.fillStyle = '#000'; ctx.fillRect(b0, b1, b2 - b0, b3 - b1); }
  ctx.fillStyle = '#e33'; const [e0, e1, e2, e3] = VIS.BELT; ctx.fillRect(e0 + 10, e1 + 6, e2 - e0 - 20, e3 - e1 - 12);
  ctx.strokeStyle = '#fa3'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
  (VIS.WARNINGS || []).forEach(([, [x0, y0, x1, y1]]) => ctx.strokeRect(x0, y0, x1 - x0, y1 - y0)); ctx.setLineDash([]);
  if (VIS.PARK) { ctx.font = 'bold 28px sans-serif'; ctx.fillText('PARK', VIS.PARK[0] + 4, VIS.PARK[3] - 14); }
  ctx.restore();
}

async function load() {
  const name = $('layout').value || 'apex';
  layout = await (await fetch('../../apps/cluster_themes/hud/layouts/' + name + '.json?' + Date.now())).json();
  theme = TH.THEMES[layout.theme] || TH.THEMES.gt3;
  const warns = VIS.check(layout.widgets.filter((w) => w.toggle !== 'mapUp'), 'panel');
  $('ok').textContent = warns.length ? '' : 'Visibility check: nothing under the camera, arrows, hood, box, belt or PARK light.';
  $('warn').textContent = warns.join('\n');
}

(async () => {
  SH = await cjs('../../shared/shaders.js'); TH = await cjs('../../shared/hud_themes.js'); VIS = await cjs('../../shared/visible.js');
  const q = new URLSearchParams(location.search);
  if (q.get('layout')) $('layout').value = q.get('layout');
  if (q.get('rpm')) $('rpm').value = q.get('rpm');
  if (q.get('car') === '0') $('car').checked = false;
  await load();
  $('layout').addEventListener('change', load);
  $('sweep').onclick = () => { const t0 = performance.now(); const tick = () => { const k = (performance.now() - t0) / 4000;
    $('rpm').value = k < 0.75 ? 900 + k / 0.75 * 6000 : 6900; if (k < 1.2) requestAnimationFrame(tick); }; tick(); };
  let busy = false;
  setInterval(async () => { if (busy) return; busy = true; try { await draw(); } catch (e) { $('warn').textContent = String(e.stack || e); } busy = false; }, 50);
})();
</script>
</body>
</html>
